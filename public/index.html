<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BibleGPT - AI Bible Assistant</title>
    
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-sidebar: #111827;
            --bg-chat: #1a1a2e;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --border-color: #2d2d4a;
            --user-msg-bg: #1e1e3a;
            --bot-msg-bg: transparent;
            --input-bg: #1e1e3a;
            --gold: #f0c040;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-title .icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .new-chat-btn {
            margin: 12px;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .new-chat-btn:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 2px;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
        }

        .history-item.active {
            background: rgba(139,92,246,0.15);
            color: var(--text-primary);
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border-color);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        .user-info:hover {
            background: rgba(255,255,255,0.05);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #4ade80;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: #000;
        }

        .user-name {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Main Chat Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-primary);
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .model-badge {
            background: rgba(139,92,246,0.2);
            color: #a78bfa;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .chat-header-actions {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .header-btn:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
        }

        .message.bot .message-avatar {
            background: var(--accent);
        }

        .message.user .message-avatar {
            background: #4ade80;
            color: #000;
        }

        .message-content {
            flex: 1;
            line-height: 1.6;
        }

        .message-role {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .message-text {
            color: #d1d5db;
            font-size: 0.95rem;
        }

        .message.user .message-content {
            background: var(--user-msg-bg);
            padding: 12px 16px;
            border-radius: 12px;
        }

        .message.user .message-role {
            display: none;
        }

        .message.user .message-text {
            color: #e5e7eb;
        }

        .message-time {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 6px;
        }

        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 8px 0;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #6b7280;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* Input Area */
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-primary);
        }

        .input-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        #promptInput {
            width: 100%;
            padding: 14px 16px;
            padding-right: 50px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            resize: none;
            min-height: 48px;
            max-height: 150px;
            transition: border-color 0.2s;
        }

        #promptInput:focus {
            border-color: var(--accent);
        }

        #promptInput::placeholder {
            color: #6b7280;
        }

        .send-btn {
            background: var(--accent);
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .disclaimer {
            text-align: center;
            color: #6b7280;
            font-size: 0.75rem;
            padding: 8px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Scrollbar */
        .chat-messages::-webkit-scrollbar,
        .chat-history::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-track,
        .chat-history::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb,
        .chat-history::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            
            .message {
                max-width: 100%;
            }
            
            .chat-messages {
                padding: 12px;
            }
        }

        /* Menu toggle for mobile */
        .menu-toggle {
            display: none;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 6px;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">
                <span class="icon">📖</span>
                BibleGPT
            </div>
        </div>
        
        <button class="new-chat-btn" onclick="newChat()">
            <span>+</span> New Chat
        </button>
        
        <div class="chat-history" id="chatHistory">
            <div class="history-item active" data-id="1" onclick="switchChat(this)">
                Bible Study Guide
            </div>
        </div>
        
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">U</div>
                <span class="user-name">User</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="chat-header">
            <div class="chat-header-left">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <span class="model-badge">BibleGPT 3.5</span>
            </div>
            <div class="chat-header-actions">
                <button class="header-btn" onclick="newChat()" title="New Chat">+ New</button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-avatar">📖</div>
                <div class="message-content">
                    <div class="message-role">BibleGPT</div>
                    <div class="message-text">Hello! How can I assist you today with your questions about the Bible?</div>
                    <div class="message-time" id="initialTime"></div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="promptInput" 
                        placeholder="Ask me anything about the Bible..."
                        maxlength="500"
                        onkeypress="handleKeyPress(event)"
                        oninput="updateCharCount()"
                    >
                </div>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send message">
                    ➤
                </button>
            </div>
            <div class="disclaimer">
                BibleGPT can make mistakes. Check important info.
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const promptInput = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatHistory = document.getElementById('chatHistory');
        let currentChatId = 1;
        let chatCount = 1;

        // Set initial time
        function updateInitialTime() {
            const timeEl = document.getElementById('initialTime');
            if (timeEl) {
                timeEl.textContent = getTimeAgo(new Date());
            }
        }

        function getTimeAgo(date) {
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);
            
            if (diff < 60) return 'Just now';
            if (diff < 3600) return `${Math.floor(diff / 60)} minutes ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)} hours ago`;
            return `${Math.floor(diff / 86400)} days ago`;
        }

        function getCurrentTime() {
            return new Date().toLocaleTimeString('en-US', { 
                hour: 'numeric', 
                minute: '2-digit',
                hour12: true 
            });
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const avatar = sender === 'bot' ? '📖' : 'U';
            const role = sender === 'bot' ? 'BibleGPT' : 'You';
            
            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    <div class="message-role">${role}</div>
                    <div class="message-text">${escapeHtml(text)}</div>
                    <div class="message-time">${getTimeAgo(new Date())}</div>
                </div>
            `;
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="message-avatar">📖</div>
                <div class="message-content">
                    <div class="message-role">BibleGPT</div>
                    <div class="typing-indicator">
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeTypingIndicator() {
            const typingDiv = document.getElementById('typingIndicator');
            if (typingDiv) {
                typingDiv.remove();
            }
        }

        function updateCharCount() {
            // Character count handled by maxlength attribute
        }

        async function sendMessage() {
            const prompt = promptInput.value.trim();
            
            if (!prompt) return;
            
            if (prompt.length > 500) {
                alert('Your question is too long. Please keep it under 500 characters.');
                return;
            }

            // Add user message
            addMessage(prompt, 'user');
            promptInput.value = '';

            // Disable input
            promptInput.disabled = true;
            sendBtn.disabled = true;

            // Show typing indicator
            addTypingIndicator();

            // Update sidebar history item
            updateHistoryItem(prompt);

            try {
                const response = await fetch('/api/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt: prompt })
                });

                removeTypingIndicator();

                if (!response.ok) {
                    if (response.status === 429) {
                        const data = await response.json();
                        throw new Error(data.error || 'Too many requests. Please wait a moment.');
                    } else if (response.status === 403) {
                        throw new Error('Access denied. Please use the official website.');
                    } else {
                        throw new Error('Failed to get response. Please try again.');
                    }
                }

                const data = await response.json();
                
                // Handle different response formats
                let botResponse = '';
                if (typeof data === 'string') {
                    botResponse = data;
                } else if (data.response) {
                    botResponse = data.response;
                } else if (data.message) {
                    botResponse = data.message;
                } else if (data.answer) {
                    botResponse = data.answer;
                } else {
                    botResponse = JSON.stringify(data);
                }

                addMessage(botResponse, 'bot');

            } catch (error) {
                removeTypingIndicator();
                const errorMsg = addMessage('❌ ' + error.message, 'bot');
                errorMsg.querySelector('.message-text').style.color = '#fca5a5';
            } finally {
                // Re-enable input
                promptInput.disabled = false;
                sendBtn.disabled = false;
                promptInput.focus();
            }
        }

        function updateHistoryItem(prompt) {
            const activeItem = chatHistory.querySelector('.history-item.active');
            if (activeItem && prompt) {
                activeItem.textContent = prompt.length > 30 ? prompt.substring(0, 30) + '...' : prompt;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function newChat() {
            chatCount++;
            currentChatId = chatCount;
            
            // Add new history item
            const historyItems = chatHistory.querySelectorAll('.history-item');
            historyItems.forEach(item => item.classList.remove('active'));
            
            const newItem = document.createElement('div');
            newItem.className = 'history-item active';
            newItem.dataset.id = currentChatId;
            newItem.textContent = 'New Chat';
            newItem.onclick = function() { switchChat(this); };
            chatHistory.insertBefore(newItem, chatHistory.firstChild);
            
            // Clear messages except welcome
            chatMessages.innerHTML = `
                <div class="message bot">
                    <div class="message-avatar">📖</div>
                    <div class="message-content">
                        <div class="message-role">BibleGPT</div>
                        <div class="message-text">Hello! How can I assist you today with your questions about the Bible?</div>
                        <div class="message-time">${getTimeAgo(new Date())}</div>
                    </div>
                </div>
            `;
            
            promptInput.focus();
        }

        function switchChat(element) {
            const historyItems = chatHistory.querySelectorAll('.history-item');
            historyItems.forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            currentChatId = parseInt(element.dataset.id);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.style.display = sidebar.style.display === 'none' ? 'flex' : 'none';
        }

        // Initialize
        updateInitialTime();
        promptInput.focus();

        // Auto-resize input
        promptInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });
    </script>
</body>
</html>
